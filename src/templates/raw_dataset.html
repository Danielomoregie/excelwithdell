<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FusionTech Raw Reviews</title>
    <link rel="stylesheet" href="/static/raw_dataset.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="header-left">
                <button class="hamburger-btn" id="hamburgerBtn" aria-label="Open navigation" title="Menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <a href="/" aria-label="Go to dashboard home">
                    <img src="/static/fusiontech_logo_compact.svg" alt="FusionTech Systems" class="header-logo">
                </a>
                <div class="header-text">
                    <h1>Raw Reviews</h1>
                    <p class="subtitle">Explore online customer reviews with live filtering</p>
                </div>
            </div>
            <div class="header-right">
                <a class="back-link" href="/">Back to Dashboard</a>
            </div>
        </div>
    </header>

    <aside class="side-drawer" id="sideDrawer" aria-hidden="true">
        <div class="side-drawer-header">
            <h3>Navigation</h3>
        </div>
        <nav class="side-drawer-nav">
            <a href="/" class="side-drawer-item" id="dashboardNavItem">
                <span class="side-drawer-item-icon">📊</span>
                <span>Dashboard</span>
            </a>
            <a href="/product-risk" class="side-drawer-item" id="productRiskNavItem">
                <span class="side-drawer-item-icon">📈</span>
                <span>Product Risk Scores</span>
            </a>
            <a href="/raw-dataset" class="side-drawer-item active" id="rawReviewNavItem">
                <span class="side-drawer-item-icon">📋</span>
                <span>Raw Reviews</span>
            </a>
        </nav>
    </aside>
    <div class="drawer-backdrop" id="drawerBackdrop"></div>

    <main class="page-wrap">
        <section class="controls-card">
            <div class="controls-row">
                <div class="control-group">
                    <label for="tableSelect">Table</label>
                    <select id="tableSelect"></select>
                </div>
                <div class="control-group control-limit">
                    <label for="rowLimit">Rows</label>
                    <select id="rowLimit">
                        <option value="50">50</option>
                        <option value="100" selected>100</option>
                        <option value="200">200</option>
                        <option value="500">500</option>
                    </select>
                </div>
                <button id="refreshBtn" class="btn-primary">Refresh</button>
            </div>
            
            <div class="filter-section">
                <div class="filter-header">
                    <span class="filter-label">🔍 Find By Column</span>
                </div>
                <div class="filter-controls-row">
                    <div class="control-group">
                        <label for="filterColumn">Column</label>
                        <select id="filterColumn">
                            <option value="">-- Select Column --</option>
                        </select>
                    </div>
                    <div class="control-group" id="filterOperatorGroup" style="display: none;">
                        <label for="filterOperator">Operator</label>
                        <select id="filterOperator">
                            <option value="=">=</option>
                            <option value=">">&gt;</option>
                            <option value="<">&lt;</option>
                            <option value=">=">&gt;=</option>
                            <option value="<=">&lt;=</option>
                        </select>
                    </div>
                    <div class="control-group filter-value-group" id="filterValueGroup" style="display: none;">
                        <label for="filterValue">Value</label>
                        <input id="filterValue" type="text" placeholder="Enter value...">
                    </div>
                    <div class="control-group filter-value-group" id="filterRangeGroup" style="display: none;">
                        <label for="filterRange">Rating: <span id="rangeValue">0-5</span></label>
                        <div class="range-slider-container">
                            <input id="filterRangeMin" type="range" min="0" max="5" step="0.5" value="0">
                            <input id="filterRangeMax" type="range" min="0" max="5" step="0.5" value="5">
                        </div>
                    </div>
                    <div class="filter-buttons">
                        <button id="applyFilterBtn" class="btn-primary btn-small">Apply</button>
                        <button id="clearFilterBtn" class="btn-secondary btn-small">Clear</button>
                    </div>
                </div>
                <div id="activeFilters" class="active-filters"></div>
            </div>
            
            <div class="stats-row">
                <span id="tableNameBadge" class="badge">Table: --</span>
                <span id="rowStats" class="badge">Rows: --</span>
            </div>
        </section>

        <section class="table-card">
            <div class="table-shell" id="tableShell">
                <table id="datasetTable">
                    <thead id="datasetHead"></thead>
                    <tbody id="datasetBody"></tbody>
                </table>
            </div>
            <div class="pagination-row">
                <button id="prevBtn" class="btn-secondary">Previous</button>
                <span id="pageInfo">Page 1</span>
                <button id="nextBtn" class="btn-secondary">Next</button>
            </div>
        </section>
    </main>

    <!-- Review Detail Modal -->
    <div id="reviewModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Review Details</h2>
                <button class="close-modal" id="closeModal">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Content will be dynamically populated -->
            </div>
        </div>
    </div>

    <script src="/static/raw_dataset.js"></script>
</body>
</html>
